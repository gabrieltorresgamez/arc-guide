# Hashed build files (/_astro/) never change; other static files may change with each build. Empty = no header.
map $uri $cache_control {
    ~^/_astro/                "public, max-age=31536000, immutable";
    ~*\.(css|js|svg|woff2)$   "public, max-age=86400";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
    server_tokens off;
    access_log off;  # the reverse proxy in front keeps the request log (7 days, see /privacy/)

    # nginx has no mime type for .md; without this browsers and LLM clients would download the files
    types {
        text/markdown md;
    }
    default_type text/plain;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;

    # Server level only: an add_header inside a location would drop all of these for that location.
    add_header Cache-Control $cache_control;
    add_header Strict-Transport-Security "max-age=31536000" always;  # ignored by browsers over plain HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Everything is served from this origin. 'unsafe-inline' is needed for Starlight's inline theme script and the inline
    # styles of code blocks; 'wasm-unsafe-eval' for the Pagefind search index.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/index.html =404;
    }
}
